name: Bake Taxi - Passenger Analyze Only

on:
  push:
    branches:
      - flutter-migration
    paths:
      - 'apps/passenger/**'
      - 'packages/jibek_shared/**'
      - '.github/workflows/analyze-passenger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-passenger:
    name: Analyze passenger app (no APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Get passenger dependencies
        working-directory: apps/passenger
        run: flutter pub get

      - name: Analyze passenger app
        working-directory: apps/passenger
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings

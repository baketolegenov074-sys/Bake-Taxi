name: jibek_driver
description: Driver app for Bake Taxi.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  jibek_shared:
    path: ../../packages/jibek_shared
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  permission_handler: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - ../driver_icon.png
    - assets/bake_intro.gif

name: bake_taxi
description: Bake Taxi - Client, Driver and Owner applications
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bake_taxi_shared:
    path: packages/bake_taxi_shared
  bake_taxi_passenger:
    path: apps/passenger
  bake_taxi_driver:
    path: apps/driver
  bake_taxi_owner_admin:
    path: apps/owner_admin
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  http: ^1.3.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
